# My tmux configuration file

# Terminal settings for proper Unicode/Nerd Font support
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"

# Keybindings
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind -n M-j next-window
bind -n M-k previous-window

# Mobile-friendly bindings (easy on touch keyboards)
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind 0 select-window -t 10

# Easy pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick splits (easier than ( and ) on mobile)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Quick actions
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind x kill-pane
bind X kill-window
bind z resize-pane -Z

# Options
set-window-option -g pane-base-index 1
set-option -g base-index 1
set -g mouse on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind ) split-window -c "#{pane_current_path}"
bind ( split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
set -g status-position top
# set -g cmdheight=1

# Tmux Package Manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jaclu/tmux-menus'

# tmux-menus config (prefix + m to open)
set -g @menus_trigger "m"

# Colorscheme
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'
set-option -sa terminal-overrides ",xterm*:Tc"
set -g pane-border-style bg=default,fg=default
set -g pane-active-border-style bg=default,fg=default


set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
run '~/.tmux/plugins/tpm/tpm'

# Override gruvbox status bar
# Clickable + button on left to create new window
set -g status-left '#[fg=colour246,bg=colour237] 󰐕 #[fg=colour237,bg=colour234]'
bind -n MouseDown1StatusLeft new-window -c "#{pane_current_path}"

# Remove date/time from right side
set -g status-right '#[fg=colour237,bg=colour234,nobold,nounderscore,noitalics]#[fg=colour246,bg=colour237] #h '
