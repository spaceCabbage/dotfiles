format = "[┌](fg:#688080)$username${custom.hostname_local}$hostname$git_branch$git_status$cmd_duration [─](fg:#688080)$fill[─](fg:#688080) $jobs$direnv$c$conda$docker_context$python$golang$lua$nodejs$rust${custom.mem_low}${custom.mem_mid}${custom.mem_high}$line_break[└](fg:#688080)$directory$character"
right_format = ""

[username]
show_always = true
format = "[${user}](fg:#83a598)"
style_user = "fg:#83a598"
style_root = "fg:#fb4934 bold"

[hostname]
ssh_only = true
format = "[@](fg:#688080)[${hostname}](fg:#fabd2f) "

[custom.hostname_local]
command = "hostname"
when = "[ -z \"$SSH_CONNECTION\" ]"
format = "[@$output](fg:#688080) "

[line_break]
disabled = false

[fill]
symbol = "─"
style = "fg:#688080"

[c]
symbol = " "
style = "fg:#A8B9CC"
format = "[$symbol($version )]($style)"

[conda]
symbol = " "
style = "fg:#83a598"

[directory]
read_only = " 󰌾"
style = "fg:#689d6a"
truncation_length = 4


[docker_context]
symbol = " "
style = "fg:#0db7ed"

[python]
symbol = " "
style = "fg:#3776AB"
format = "[$symbol($version )($virtualenv )]($style)"

[golang]
symbol = " "
style = "fg:#00ADD8"
format = "[$symbol($version )]($style)"

[lua]
symbol = " "
style = "fg:#83a598"
format = "[$symbol($version )]($style)"

[memory_usage]
disabled = true

[custom.mem_low]
command = "free -h | awk '/^Mem:/ {gsub(/i$/,\"\",$3); print $3}'"
when = "[ $(free | awk '/^Mem:/ {printf \"%.0f\", $3/$2*100}') -lt 50 ]"
symbol = "󰍛 "
style = "fg:#98971a"
format = "[$symbol$output]($style) "

[custom.mem_mid]
command = "free -h | awk '/^Mem:/ {gsub(/i$/,\"\",$3); print $3}'"
when = "[ $(free | awk '/^Mem:/ {printf \"%.0f\", $3/$2*100}') -ge 50 ] && [ $(free | awk '/^Mem:/ {printf \"%.0f\", $3/$2*100}') -lt 80 ]"
symbol = "󰍛 "
style = "fg:#fabd2f"
format = "[$symbol$output]($style) "

[custom.mem_high]
command = "free -h | awk '/^Mem:/ {gsub(/i$/,\"\",$3); print $3}'"
when = "[ $(free | awk '/^Mem:/ {printf \"%.0f\", $3/$2*100}') -ge 80 ]"
symbol = "󰍛 "
style = "fg:#fb4934"
format = "[$symbol$output]($style) "

[nodejs]
symbol = " "
style = "fg:#8CC84B"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "fg:#B7410E"
format = "[$symbol($version )]($style)"

[git_branch]
symbol = " "
style = "fg:#79740e"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "fg:#98971a"

[direnv]
disabled = false
format = "[$symbol]($style)"
symbol = " "
style = "fg:#fabd2f"

[env_var]
variable = "PYTHON_ENV"
symbol = "🐍="
style = "fg:#928374"

[cmd_duration]
min_time = 2000
style = "fg:#bdae93"
format = "[$duration]($style) "

[time]
disabled = false
format = "[$time](fg:#928374) "
time_format = "%-I:%M%p"

[status]
disabled = false
format = "[$symbol]($style)"
symbol = "✘"
style = "fg:#fb4934"

[jobs]
disabled = false
format = "[$symbol$number]($style) "
symbol = "✦"
style = "fg:#fabd2f"

[character]
success_symbol = "[󰁔](fg:#83a598)"
error_symbol = "[󰁔](fg:#fb4934)"
