# Hyprland Configuration
# Gruvbox-themed Wayland compositor with blur and transparency

# ========================================
# Environment Variables (NVIDIA)
# ========================================
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = GTK_THEME,Adwaita:dark

# ========================================
# Monitor Configuration
# ========================================
monitor=,preferred,auto,1

# ========================================
# Startup Programs
# ========================================
exec-once = waybar -c ~/.config/waybar/config-hyprland.jsonc
exec-once = mako
exec-once = swww-daemon
exec-once = swww img /home/yehuda/Pictures/sts-130.png
exec-once = wl-paste --watch cliphist store
exec-once = wlsunset -l 32.0809 -L 34.7806
exec-once = /usr/lib/xdg-desktop-portal-gtk
exec-once = /usr/lib/xdg-desktop-portal-hyprland

# ========================================
# Input Configuration
# ========================================
input {
    kb_layout = us,il
    kb_options = grp:alt_shift_toggle

    repeat_delay = 300
    repeat_rate = 50

    follow_mouse = 1

    touchpad {
        tap-to-click = true
        natural_scroll = true
        scroll_factor = 1.0
    }

    accel_profile = flat
    sensitivity = 0
}

# ========================================
# General Settings
# ========================================
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2

    col.active_border = rgb(83a598)
    col.inactive_border = rgb(504945)

    layout = dwindle
    allow_tearing = false
}

# ========================================
# Decoration (Blur & Transparency)
# ========================================
decoration {
    rounding = 6

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(00000080)
    }

    active_opacity = 1.0
    inactive_opacity = 0.95
}

# ========================================
# Animations
# ========================================
animations {
    enabled = true

    bezier = smooth, 0.25, 0.1, 0.25, 1

    animation = windows, 1, 4, smooth, slide
    animation = windowsOut, 1, 4, smooth, slide
    animation = fade, 1, 3, smooth
    animation = workspaces, 1, 4, smooth, slide
}

# ========================================
# Layout
# ========================================
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# ========================================
# Misc
# ========================================
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ========================================
# Window Rules
# ========================================
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = size 600 400,class:^(pavucontrol)$
windowrulev2 = float,class:^(nm-connection-editor)$
windowrulev2 = float,class:^(blueman-manager)$
windowrulev2 = float,class:^(blueberry.py)$
windowrulev2 = float,class:^(org.gnome.Calculator)$
windowrulev2 = float,class:^(gnome-calculator)$
windowrulev2 = float,class:^(kcalc)$
windowrulev2 = float,class:^(xdg-desktop-portal-gtk)$
windowrulev2 = float,class:^(file-roller)$
windowrulev2 = float,class:^(org.gnome.FileRoller)$
windowrulev2 = float,title:^(Open File)$
windowrulev2 = float,title:^(Save File)$
windowrulev2 = float,title:^(Open Folder)$

# Scratchpad terminal
windowrulev2 = float,class:^(scratchpad)$
windowrulev2 = size 80% 60%,class:^(scratchpad)$
windowrulev2 = center,class:^(scratchpad)$

# Blur for terminal
windowrulev2 = opacity 0.9 0.85,class:^(org.kde.konsole)$
windowrulev2 = opacity 0.9 0.85,class:^(konsole)$

# ========================================
# Keybindings
# ========================================
$mod = SUPER

# ---- Applications ----
bind = $mod, Return, exec, konsole
bind = $mod SHIFT, Return, exec, konsole --name scratchpad
bind = $mod, B, exec, brave
bind = $mod, E, exec, dolphin
bind = ALT, Space, exec, rofi -show drun

# ---- Window Management ----
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 1
bind = $mod SHIFT, F, fullscreen, 0
bind = $mod, Space, togglefloating

# ---- Navigation (Arrow Keys) ----
bind = $mod, Left, movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up, movefocus, u
bind = $mod, Down, movefocus, d

# ---- Move Windows ----
bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Right, movewindow, r
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Down, movewindow, d

# ---- Mouse Scroll for Workspaces ----
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# ---- Workspaces ----
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod, Tab, workspace, previous

# ---- Resize ----
bind = $mod, Minus, resizeactive, -10% 0
bind = $mod, Equal, resizeactive, 10% 0
bind = $mod SHIFT, Minus, resizeactive, 0 -10%
bind = $mod SHIFT, Equal, resizeactive, 0 10%

# ---- Screenshots ----
bind = $mod, S, exec, ~/.local/bin/screenshot.sh area
bind = $mod SHIFT, S, exec, ~/.local/bin/screenshot.sh full
bind = , Print, exec, ~/.local/bin/screenshot.sh full

# ---- Utilities ----
bind = $mod, V, exec, ~/.local/bin/clipboard.sh
bind = $mod, P, exec, hyprpicker -a
bind = $mod, L, exec, swaylock

# ---- Media Keys ----
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ---- Brightness Keys ----
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ---- Player Controls ----
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# ---- Session ----
bind = $mod SHIFT, Q, exec, ~/.local/bin/powermenu.sh
bind = $mod SHIFT, E, exit
bind = $mod SHIFT, R, exec, hyprctl reload

# ---- Mouse bindings ----
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
